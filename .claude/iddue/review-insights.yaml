version: 1
insights:
  - id: "insight-001"
    category: "style"
    severity: "INFO"
    title: "モノレポ構成でのトップレベル.gitignore変更を避ける"
    guideline: |
      サブディレクトリ（例: frontend/, backend/）に専用の .gitignore が存在する場合、
      そのサブディレクトリ配下にのみ関係するパターンはサブディレクトリの .gitignore に記載する。
      リポジトリトップレベルの .gitignore には、リポジトリ全体に関係するパターンのみを記載し、
      特定サブディレクトリのみに関係するパターンを追加しない。
    anti_pattern: |
      frontend/ 配下にのみ関係する node_modules や build 成果物のパターンを、
      frontend/.gitignore が存在するにもかかわらずリポジトリトップレベルの .gitignore に追加する。
    good_pattern: |
      frontend/ 配下のみに関係するパターンは frontend/.gitignore に追加し、
      トップレベルの .gitignore はリポジトリ全体で共通のパターン（エディタ設定、OS生成ファイルなど）のみを保持する。
    scope:
      - ".gitignore"
      - "frontend/.gitignore"
      - "backend/.gitignore"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684105887"
        summary: "frontend/.gitignore が有効なら関連パターンはそちらに書くべきで、トップレベルの .gitignore への追加は不要という指摘"

  - id: "insight-002"
    category: "design"
    severity: "WARNING"
    title: "副作用を伴う検証UIはページ単位に留め共通レイアウトに置かない"
    guideline: |
      GraphQL/バックエンド接続確認などのヘルスチェックやスモークテストのような、
      API呼び出しを伴う検証UIはページ単位のコンポーネントに実装する。
      RootLayout など全ページ共通のレイアウトコンポーネントに実装すると、
      ページ遷移のたびに不要なAPI呼び出しが発生してしまう。
    anti_pattern: |
      ヘルスチェックのような常時実行される検証処理を RootLayout などの共通レイアウトに実装し、
      ページ遷移のたびにAPIコールが走ってしまう。
    good_pattern: |
      ヘルスチェックは HomePage など特定のページコンポーネントに留め、
      そのページを訪れたときにのみ検証が実行されるようにする。
    scope:
      - "frontend/src/pages/**"
      - "frontend/src/layouts/**"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684321144"
        summary: "ヘルスチェックをページではなくレイアウトに実装すべきか問う指摘（結論：API呼び出し重複を避けるためページに留めるべきと判断）"

  - id: "insight-003"
    category: "design"
    severity: "WARNING"
    title: "ヘッダーには個別ページへのリンクは設けない"
    guideline: |
      共通ヘッダー（RootLayout 等）には各ページへの直接的なナビゲーションリンクを設けない。
    anti_pattern: |
      ヘッダーに各ページへの個別リンクを並べる。
    good_pattern: |
      ヘッダーにはアプリ名（例: BakeLoose）のコンポーネントのみを配置し、
      クリックするとトップページ（ホーム）に遷移するようにする。個別ページへのリンクはヘッダーに含めない。
    scope:
      - "frontend/src/layouts/**"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684344773"
        summary: "BakeLooseロゴのクリックでトップページに戻るようにすべきという指摘"
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684346619"
        summary: "ヘッダーに各ページへの個別リンクは不要という指摘"

  - id: "insight-004"
    category: "style"
    severity: "INFO"
    title: "テスト用のセットアップ・モックファイルはtest/ディレクトリ配下に配置する"
    guideline: |
      フロントエンドのテスト共通セットアップファイルやGraphQLモック等の補助ファイルは
      src 配下ではなく、専用の test/ ディレクトリ
      （例: frontend/test/test-setup.ts, frontend/test/mocks/urql.ts）配下に配置すること。
    anti_pattern: |
      テストセットアップファイルやモックファイルを src/ 配下やテスト対象と同じ
      ディレクトリに配置する。
    good_pattern: |
      frontend/test/test-setup.ts や frontend/test/mocks/urql.ts のように、
      テスト関連の補助ファイルを test/ ディレクトリにまとめて配置する。
    scope:
      - "frontend/test/**"
      - "frontend/src/**/*.test.*"
    status: active
    frequency: 1
    last_seen: "2026-08-11"
    added_from_pr: 55
    evidence:
      - pr: 55
        comment_url: "https://github.com/fucso/bake-loose/pull/55#discussion_r3729772626"
        summary: "test-setup.ts を frontend/test/test-setup.ts に配置するよう指摘"
      - pr: 55
        comment_url: "https://github.com/fucso/bake-loose/pull/55#discussion_r3729773631"
        summary: "urql モックファイルを frontend/test/mocks/urql.ts に配置するよう指摘"

  - id: "insight-005"
    category: "testing"
    severity: "INFO"
    title: "新規UIコンポーネント・ページ実装にはStorybookのstoryを併せて作成する"
    guideline: |
      共通UIプリミティブ（dialog等）や機能コンポーネント（モーダル等）を新規実装する際は、
      実装と合わせて Storybook の story ファイル（*.stories.tsx）を作成し、
      Storybook上で見た目・状態を確認できるようにする。
    anti_pattern: |
      新規コンポーネントの実装のみを行い、Storybookでの動作確認手段（stories.tsx）を
      用意しない。
    good_pattern: |
      コンポーネントの実装ファイルと同じディレクトリに *.stories.tsx を追加し、
      Storybook上で確認できる状態にする。
    scope:
      - "frontend/src/components/**"
      - "frontend/src/pages/**"
    status: active
    frequency: 1
    last_seen: "2026-08-16"
    added_from_pr: 69
    evidence:
      - pr: 69
        comment_url: "https://github.com/fucso/bake-loose/pull/69#discussion_r3791201622"
        summary: "components/ui/dialog.tsx に storybook を作成してほしいという指摘"
      - pr: 69
        comment_url: "https://github.com/fucso/bake-loose/pull/69#discussion_r3791217562"
        summary: "components/projects/CreateProjectModal.tsx に storybook を作成してほしいという指摘"

  - id: "insight-006"
    category: "testing"
    severity: "WARNING"
    title: "ページのStorybookには通常状態に加え接続エラー・空データ等の特殊状態も用意する"
    guideline: |
      GraphQLクエリ結果を表示するページコンポーネントのStorybookでは、
      正常系のデータ表示だけでなく、接続エラーやクエリ結果が0件などの特殊なパターンも
      検証できるstoryをあわせて用意する。
    anti_pattern: |
      正常系（データ取得成功）のstoryのみを用意し、エラー状態や空状態（LoadingSpinner /
      EmptyState / ErrorState 等の分岐）の見た目を確認する手段が用意されていない。
    good_pattern: |
      MockGraphQLError 等でGraphQLエラーレスポンスをモックしたstoryや、
      クエリ結果が0件の場合のstoryを個別に用意し、
      LoadingSpinner / EmptyState / ErrorState それぞれの見た目を確認できるようにする。
    scope:
      - "frontend/src/pages/**"
    status: active
    frequency: 1
    last_seen: "2026-08-16"
    added_from_pr: 69
    evidence:
      - pr: 69
        comment_url: "https://github.com/fucso/bake-loose/pull/69#discussion_r3791192100"
        summary: "ProjectsPage.tsx について、接続エラー・クエリー結果0件などの特殊パターンを検証できるstorybookを用意してほしいという指摘"
