        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4039274349"
        summary: "find_by_id後のエラーハンドリングの記載方法がファイルごとにブレがあるので統一してほしいという指摘"

  - id: "insight-018"
    category: "style"
    severity: "INFO"
    title: "スキーマ命名規則のprefix/suffixは曖昧な言葉でなくコード上の定数として明文化する"
    guideline: |
      DBスキーマ（テーブル名・制約名等）で使用するprefix/suffixは「よく使われる」といった曖昧な
      定義に頼らず、プロジェクトのルールとして明文化する。Rustアプリケーション側では
      `backend/src/repository/naming_conventions.rs` に定数として定義する。
    anti_pattern: |
      制約名などのprefix/suffixを「よく使われる形式」という曖昧な認識のみに依存してコード内に
      ハードコードする。
    good_pattern: |
      `backend/src/repository/naming_conventions.rs` にprefix/suffixを定数として定義し、
      それを参照する。
    scope:
      - "backend/src/repository/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4057146201"
        summary: "よく使われるという曖昧な定義でなくスキーマ命名ルールとしてprefix/suffixを定めたい、rust側はnaming_conventions.rsに定数化してほしいという指摘"

  - id: "insight-019"
    category: "style"
    severity: "WARNING"
    title: "コードコメントは自明・文脈依存の内容を避け、恒久的な知見はrulesに記載する"
    guideline: |
      enum名やフィールド名から内容が推測可能な場合や、変数名を単に日本語訳して情報を付け加えた
      だけのコメントは記載しない。「presentation層は〜」のような以前のレビュー・実装文脈に依存する
      コメント（後から見返すと文脈が失われて誤解を招く）や、「（書き込みを伴わないためトランザクション
      開始前に行う）」のような実装判断の経緯を説明するだけのコメントも記載しない。フローを説明する
      コメント（例: 「// 1. Trial取得」）を記載する場合は、他のuse_caseファイルの既存コメントの
      書き方と統一する。今後同じ間違いが想定されるなど、恒久的に残すべき知見がある場合はコードコメント
      ではなく `.claude/rules/` に記載する。
    anti_pattern: |
      コードから自明な内容や、過去のレビュー指摘・実装変更の経緯に依存した内容をコードコメントとして
      残す。ファイルによってフロー説明コメントの書き方がばらつく。
    good_pattern: |
      自明な内容や文脈依存のコメントは書かない。フロー説明コメントは既存ファイルの書き方に統一する。
      恒久的な知見は `.claude/rules/` に記載する。
    scope:
      - "backend/src/**/*.rs"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791083522"
        summary: "文脈依存で意味が変わってしまうコメントや自明なコメントは不要なので他ファイルでも見直してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791334297"
        summary: "前回のレビュー指摘に依存したコメントになっているので削除してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791340784"
        summary: "書き込みを伴わないためトランザクション開始前に行う、というコメントは不要という指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791341953"
        summary: "フローを説明するコメントは他のユースケースに合わせて記載してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4057084336"
        summary: "このコメントは記載せず、知見を残す必要があるならrulesに記載してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4057239519"
        summary: "enum名・フィールド名から推測可能なコメントは不要で、他にも変数名の日本語訳的なコメントがあれば削除してほしいという指摘"

  - id: "insight-020"
    category: "style"
    severity: "WARNING"
    title: "rulesドキュメントには実装依存の状態情報を書かず普遍的なルールのみ記載する"
    guideline: |
      `.claude/rules/` 配下のドキュメントには、実装によって変化しうる状態（現在のファイル名・
      現在の実装の詳細など）に当たる情報を書かない。rulesにはコードの実装状況に依存しない
      普遍的なルールのみを記載する。
    anti_pattern: |
      現在の実装の具体的な状態（今後変わりうる情報）をrulesドキュメントに書いてしまい、
      実装が変わった際にrulesが実態と食い違う。
    good_pattern: |
      rulesドキュメントには実装の変化に影響されない普遍的なルール・方針のみを記載する。
    scope:
      - ".claude/rules/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4057231128"
        summary: "rulesに実装によって変化する状態にあたる情報を書かず、普遍的なルールのみを記載してほしいという指摘"

  - id: "insight-021"
    category: "testing"
    severity: "INFO"
    title: "実質的に何も検証していない、または過度に緻密なテストは書かない"
    guideline: |
      テストは実際に意味のある検証になっているか確認する。例えば元々パラメーター0件のstepに対して
      removeを実行するテストでは、removeが実際に動作したかどうかの判断がつかない
      （0件のままなのか動作していないのか区別できない）。このようなテストは、パラメーター追加→
      対象外のパラメーターをremove→件数変化なしを確認→対象のパラメーターをremove→件数減少を確認、
      のように意味のある検証になるよう見直す。検証として意味を持たないテストケースは削除し、
      過度に緻密すぎるテストケースも不要であれば削除する。
    anti_pattern: |
      初期状態が0件のコレクションに対してremoveを実行し、結果が0件のままであることのみを確認する
      （removeが実際に動作したのか判断できない）テストを書く。あるいは実質的な意味を持たない
      過度に細かいテストケースを追加する。
    good_pattern: |
      1. 対象Aを追加 → 2. 対象外(None)をremove → 3. 件数=1であることを確認（remove不発を確認）
      → 4. 対象Aをremove → 5. 件数=0であることを確認、のように実際の動作差分を検証できる
      テストにする。
    scope:
      - "backend/src/domain/**/*.rs"
      - "backend/tests/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3699066039"
        summary: "0件のstepへのremoveでは動作判断がつかないため意味のあるテストケースに修正してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3699081356"
        summary: "テストとして意味がないので削除でいいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3755204212"
        summary: "これらのテストは緻密すぎるので不要という指摘"

  - id: "insight-022"
    category: "testing"
    severity: "INFO"
    title: "処理しないことの検証は専用テストを作らず基本ケースに含める"
    guideline: |
      「処理されないこと」（例: パラメーターが設定されないこと）を確認する検証は、
      基本的に一番ベーシックなケースをテストする既存のテストケースの中に含めて一緒に確認する。
      そのためだけの別のテストケースを新設しない。
    anti_pattern: |
      「〜されないこと」を確認するためだけの専用テストケースを、基本ケースのテストとは別に追加する。
    good_pattern: |
      一番ベーシックなケースをテストする既存のテスト（例: test_run_appends_step_with_position_zero_for_first_step）
      内に、処理されないことの確認も含める。
    scope:
      - "backend/tests/**"
      - "backend/src/domain/actions/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3755199824"
        summary: "処理しないことのチェックは一番ベーシックなケースの中で一緒にチェックしてほしいという指摘"

  - id: "insight-023"
    category: "testing"
    severity: "INFO"
    title: "同じparameter contextの種類・value typeのテストはまとめる"
    guideline: |
      パラメーターのテストにおいて、同じparameter contextの種類、value typeのものは
      個別のテストケースに分散させず1つのテストにまとめる。
    anti_pattern: |
      同じparameter context種類・value typeの組み合わせに対するテストが複数のテストケースに
      分散している。
    good_pattern: |
      同じparameter context種類・value typeのケースは1つのテスト関数にまとめて検証する。
    scope:
      - "backend/src/domain/validators/trial/parameter_validator.rs"
      - "backend/tests/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3730151508"
        summary: "同じparameter contextの種類、value typeのものはパラメーターテストにまとめてほしいという指摘"

  - id: "insight-024"
    category: "style"
    severity: "INFO"
    title: "パラメータ化テストの入力/期待値変数の命名をinput_/after_で統一する"
    guideline: |
      パラメータ化テストの引数（テストケースのフィールド）は、入力値を `input_{field}`、
      実行後の期待値を `after_{field}` の形式で命名する。
    anti_pattern: |
      パラメータ化テストの入力・期待値のフィールド名がテストケースごとに命名規則がばらつく。
    good_pattern: |
      `input_name`, `input_memo`, `after_name`, `after_memo` のようにinput_/after_プレフィックスで
      統一する。
    scope:
      - "backend/tests/**"
      - "backend/src/**/*.rs"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3730173518"
        summary: "[input_name, input_memo, after_name, after_memo]のパラメーター命名にしてほしいという指摘"

  - id: "insight-025"
    category: "testing"
    severity: "INFO"
    title: "階層データのGraphQL取得テストは部分取得と完全取得の両パターンを用意する"
    guideline: |
      Trial→Step→Parameterのような階層構造を持つデータのGraphQL取得（get/list）をテストする際は、
      step, parameterのデータを用意した上で、(a) stepまで取得せず親データのみ取得するパターンと
      (b) step, parameterまで取得するパターン、の両方をテストする。
    anti_pattern: |
      階層データを用意しても、深い階層まで含めて取得するパターンのみをテストし、
      浅い階層（親のみ）で取得するケースを検証しない。
    good_pattern: |
      step, parameterのデータを用意した上で、stepを取得しないクエリと、step・parameterまで
      取得するクエリの両方についてテストする。
    scope:
      - "backend/tests/graphql/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4039323444"
        summary: "step, parameterのデータを用意した上でstepを取得しないパターン、取得するパターンをテストしてほしいという指摘（get）"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4039341850"
        summary: "step, parameterのデータを用意した上でstepを取得しないパターン、取得するパターンをテストしてほしいという指摘（list）"

  - id: "insight-026"
    category: "testing"
    severity: "INFO"
    title: "GraphQL mutationのテストファイルはmutationごとに分割し命名規則で衝突を避ける"
    guideline: |
      GraphQL mutationのテストは、mutationごとにファイルを分ける。ファイル名は既存の
      リソース種別のテストファイルと名前が衝突しないよう `{resource}_{action}`
      （例: trial_complete, step_update）の形式にする。
    anti_pattern: |
      複数のmutationのテストを1つのファイルにまとめて実装する。あるいは既存のリソース単位の
      テストファイルと名前が衝突するファイル名を付ける。
    good_pattern: |
      trial_complete.rs, step_update.rs のようにmutationごとにファイルを分割し、
      `{resource}_{action}` の命名規則で既存ファイルとの衝突を避ける。
    scope:
      - "backend/tests/graphql/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4039354031"
        summary: "mutationごとにファイルを分け、trialのテストファイルと名前が衝突しないよう命名してほしいという指摘"

  - id: "insight-027"
    category: "testing"
    severity: "WARNING"
    title: "時刻検証のために実装へテスト専用の時刻注入を追加しない"
    guideline: |
      現在時刻を検証するテスト（例: completed_atがrun実行時の現在時刻に設定されること）のために、
      Clock traitの導入や `run_with_clock` / execute への clock 引数追加など、テストのためだけの
      実装変更を本体コードに加えない。代わりに、テスト実行前後でタイムスタンプを取得し、
      検証対象の値がその前後の範囲内（before < 対象 < after）にあることを確認する形でテストする。
    anti_pattern: |
      現在時刻をテストで厳密に検証するために、Clock traitの実装やrun_with_clock、
      clock引数の追加など、本体の実装コードにテスト専用の仕組みを追加する。
    good_pattern: |
      テスト実行前後でタイムスタンプを取得し、`before < completed_at && completed_at < after` の
      ように範囲内であることを検証する。本体コード（run/execute）はテストのための変更を含めない。
    scope:
      - "backend/src/domain/actions/**"
      - "backend/tests/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3754410610"
        summary: "現在時刻をモックできるようにClock traitを導入し、completed_atの検証条件を変更してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3755251971"
        summary: "テストのためだけの実装（run_with_clock等）を元に戻し、run前後のタイムスタンプ範囲で検証する形に変更してほしいという指摘（Clockの導入を撤回）"

  - id: "insight-028"
    category: "testing"
    severity: "INFO"
    title: "型・バリアントの組み合わせ判定ロジックは全パターンを網羅する"
    guideline: |
      値の型（バリアント）同士の一致・不一致を判定するロジック（例: ParameterValueのバリアント
      mismatch判定）を実装する際は、判定対象となる全てのバリアントの組み合わせを網羅する。
      一部のバリアントの組み合わせのみ実装し、他の組み合わせが判定漏れにならないようにする。
    anti_pattern: |
      値の一致・不一致を判定するロジックで、一部のバリアントの組み合わせ（例: Quantity と Text）が
      mismatch判定から漏れる。
    good_pattern: |
      判定対象の全バリアントの組み合わせを網羅的にテスト・実装し、漏れなくmismatch/match判定を行う。
    scope:
      - "backend/src/domain/validators/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
