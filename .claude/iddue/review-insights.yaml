version: 1
insights:
  - id: "insight-001"
    category: "style"
    severity: "INFO"
    title: "モノレポ構成でのトップレベル.gitignore変更を避ける"
    guideline: |
      サブディレクトリ（例: frontend/, backend/）に専用の .gitignore が存在する場合、
      そのサブディレクトリ配下にのみ関係するパターンはサブディレクトリの .gitignore に記載する。
      リポジトリトップレベルの .gitignore には、リポジトリ全体に関係するパターンのみを記載し、
      特定サブディレクトリのみに関係するパターンを追加しない。
    anti_pattern: |
      frontend/ 配下にのみ関係する node_modules や build 成果物のパターンを、
      frontend/.gitignore が存在するにもかかわらずリポジトリトップレベルの .gitignore に追加する。
    good_pattern: |
      frontend/ 配下のみに関係するパターンは frontend/.gitignore に追加し、
      トップレベルの .gitignore はリポジトリ全体で共通のパターン（エディタ設定、OS生成ファイルなど）のみを保持する。
    scope:
      - ".gitignore"
      - "frontend/.gitignore"
      - "backend/.gitignore"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684105887"
        summary: "frontend/.gitignore が有効なら関連パターンはそちらに書くべきで、トップレベルの .gitignore への追加は不要という指摘"

  - id: "insight-002"
    category: "design"
    severity: "WARNING"
    title: "副作用を伴う検証UIはページ単位に留め共通レイアウトに置かない"
    guideline: |
      GraphQL/バックエンド接続確認などのヘルスチェックやスモークテストのような、
      API呼び出しを伴う検証UIはページ単位のコンポーネントに実装する。
      RootLayout など全ページ共通のレイアウトコンポーネントに実装すると、
      ページ遷移のたびに不要なAPI呼び出しが発生してしまう。
    anti_pattern: |
      ヘルスチェックのような常時実行される検証処理を RootLayout などの共通レイアウトに実装し、
      ページ遷移のたびにAPIコールが走ってしまう。
    good_pattern: |
      ヘルスチェックは HomePage など特定のページコンポーネントに留め、
      そのページを訪れたときにのみ検証が実行されるようにする。
    scope:
      - "frontend/src/pages/**"
      - "frontend/src/layouts/**"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684321144"
        summary: "ヘルスチェックをページではなくレイアウトに実装すべきか問う指摘（結論：API呼び出し重複を避けるためページに留めるべきと判断）"

  - id: "insight-003"
    category: "design"
    severity: "WARNING"
    title: "ヘッダーには個別ページへのリンクは設けない"
    guideline: |
      共通ヘッダー（RootLayout 等）には各ページへの直接的なナビゲーションリンクを設けない。
    anti_pattern: |
      ヘッダーに各ページへの個別リンクを並べる。
    good_pattern: |
      ヘッダーにはアプリ名（例: BakeLoose）のコンポーネントのみを配置し、
      クリックするとトップページ（ホーム）に遷移するようにする。個別ページへのリンクはヘッダーに含めない。
    scope:
      - "frontend/src/layouts/**"
    status: active
    frequency: 1
    last_seen: "2026-08-04"
    added_from_pr: 51
    evidence:
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684344773"
        summary: "BakeLooseロゴのクリックでトップページに戻るようにすべきという指摘"
      - pr: 51
        comment_url: "https://github.com/fucso/bake-loose/pull/51#discussion_r3684346619"
        summary: "ヘッダーに各ページへの個別リンクは不要という指摘"

  - id: "insight-004"
    category: "style"
    severity: "INFO"
    title: "テスト用のセットアップ・モックファイルはtest/ディレクトリ配下に配置する"
    guideline: |
      フロントエンドのテスト共通セットアップファイルやGraphQLモック等の補助ファイルは
      src 配下ではなく、専用の test/ ディレクトリ
      （例: frontend/test/test-setup.ts, frontend/test/mocks/urql.ts）配下に配置すること。
    anti_pattern: |
      テストセットアップファイルやモックファイルを src/ 配下やテスト対象と同じ
      ディレクトリに配置する。
    good_pattern: |
      frontend/test/test-setup.ts や frontend/test/mocks/urql.ts のように、
      テスト関連の補助ファイルを test/ ディレクトリにまとめて配置する。
    scope:
      - "frontend/test/**"
      - "frontend/src/**/*.test.*"
    status: active
    frequency: 1
    last_seen: "2026-08-11"
    added_from_pr: 55
    evidence:
      - pr: 55
        comment_url: "https://github.com/fucso/bake-loose/pull/55#discussion_r3729772626"
        summary: "test-setup.ts を frontend/test/test-setup.ts に配置するよう指摘"
      - pr: 55
        comment_url: "https://github.com/fucso/bake-loose/pull/55#discussion_r3729773631"
        summary: "urql モックファイルを frontend/test/mocks/urql.ts に配置するよう指摘"

  - id: "insight-005"
    category: "design"
    severity: "INFO"
    title: "マイグレーションへの複数指摘は1つの新規ファイルにまとめて対応する"
    guideline: |
      既存の適用済みマイグレーションに対する複数の指摘（列制約の追加・変更など）が同時に出た場合、
      指摘ごとに複数の新規マイグレーションファイルを作ることは避け、1つの新規マイグレーションファイルに
      まとめて全ての指摘を反映する。既存の適用済みマイグレーションファイル自体は編集しない。
    anti_pattern: |
      同じレビューラウンドで出た複数のマイグレーション指摘に対して、指摘ごとに個別の
      新規マイグレーションファイルを分けて作成する。
    good_pattern: |
      同じレビューラウンドで出た複数のマイグレーション指摘を1つの新規マイグレーションファイル
      （例: alter_steps_position_and_trials_project_fk_constraints.sql）にまとめて反映する。
    scope:
      - "backend/migrations/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#issuecomment-5306403180"
        summary: "直前のレビューであったマイグレーションへの指摘は新しいマイグレーションファイルを1つ追加して両方とも対応してほしいという指摘"

  - id: "insight-006"
    category: "design"
    severity: "INFO"
    title: "ドメイン上の想定件数に対して過剰なサイズの整数型を使わない"
    guideline: |
      フィールドが取り得る値の範囲がドメイン上明確に小さいと想定される場合（例: 1 Trialあたりの
      Stepはせいぜい数十〜100程度）、i32のような過剰に大きい整数型をデフォルトで採用せず、
      想定される値の範囲に見合った適切なサイズの型を検討する。
    anti_pattern: |
      ステップの位置(position)のように現実的な上限が小さいフィールドに、根拠なく i32 を使用する。
    good_pattern: |
      フィールドの想定範囲を踏まえ、i16 や u8 など範囲に見合った型を選択する（あるいは選定理由を明記する）。
    scope:
      - "backend/src/domain/models/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3699019299"
        summary: "ステップはせいぜい100程度を想定しているので i32 は過剰という指摘"

  - id: "insight-007"
    category: "design"
    severity: "WARNING"
    title: "日時関連の実装は日本語圏利用を前提としJSTに統一する"
    guideline: |
      このプロダクトは日本語圏での利用を想定しているため、日時（タイムゾーン）関連の実装は
      UTCなど他のタイムゾーンではなくJSTに統一する。
    anti_pattern: |
      日時をUTCやシステムのデフォルトタイムゾーンのまま扱い、JSTへの統一を行わない。
    good_pattern: |
      日時を扱うドメインモデル・アクションはJST（Asia/Tokyo, +09:00）に統一して扱う。
    scope:
      - "backend/src/domain/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3699021968"
        summary: "日本語圏での利用を想定しているのでタイムゾーンはJSTに統一してほしいという指摘"

  - id: "insight-008"
    category: "design"
    severity: "WARNING"
    title: "外部ライブラリの日時型は専用ラッパー型でカプセル化し利用箇所を限定する"
    guideline: |
      chrono の DateTime<FixedOffset> のような外部ライブラリの型をコードベース全体に直接
      露出させず、その型をラップした専用のドメインモデル（例: timezone.rs のJST用モデル）を用意し、
      その型を経由してのみ日時を扱えるようにする。ラップ元の型（DateTime<FixedOffset>等）を扱う
      関数はラッパーの実装モジュール内に限定する。
    anti_pattern: |
      DateTime<FixedOffset> を返す関数を用意し、呼び出し側の各所で DateTime<FixedOffset> を
      直接扱わせる。
    good_pattern: |
      timezone.rs にDateTime<FixedOffset>をラップした専用モデル型とそれを操作する関数のみを定義し、
      timezone.rs 以外のコードは DateTime<FixedOffset> を直接扱わずラッパー型のみを利用する。
    scope:
      - "backend/src/domain/models/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3700665492"
        summary: "DateTime<FixedOffset>を直接利用しなくていい構成にし、timezone.rs以外から利用しないようにしたいという指摘"

  - id: "insight-009"
    category: "design"
    severity: "WARNING"
    title: "Validatorは判定結果とdomain errorのみを返し、Actionはそのまま伝播する"
    guideline: |
      Validatorはエンティティの実体ではなく判定結果（成否）とdomain errorのみを返す。
      実体（モデル）の取得が必要な場合はValidator内ではなくAction側のバリデーションステップで行う。
      Actionは、特別な意味を付与する場合を除き、Validatorが返したdomain errorを
      `validator::func()?` の形でそのまま呼び出し元に伝播させる（呼び出し側で作り直さない）。
      同一の判定ロジック（型の一致判定など）が複数箇所に実装される場合はValidatorとして外だしする。
      domain layerで発生し得るエラーは `backend/src/domain/errors/{domain}_error.rs` に
      一元管理し、Validatorはこのdomain errorを返す。
    anti_pattern: |
      Validatorがエンティティの実体まで返す。Actionがdomain errorを別のエラー型に手動で
      マッピングし直す（横流しで済む場合）。同じ型一致判定ロジックが複数のActionに
      個別に実装される。
    good_pattern: |
      Validatorは判定結果とdomain error（`domain/errors/{domain}_error.rs` で定義）のみを返し、
      必要な実体取得はAction側のバリデーションステップで行う。Actionは
      `trial_status_validator::require_in_progress(state)?;` のようにdomain errorを
      そのまま伝播する。
    scope:
      - "backend/src/domain/actions/**"
      - "backend/src/domain/validators/**"
      - "backend/src/domain/errors/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3730084534"
        summary: "特別な意味を付与する場合以外はvalidatorが出したエラーを横流しするようにという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3754380800"
        summary: "domain error領域を新設し、Validatorはdomain errorを返しActionはそのまま返す設計ルールを導入し全domain actionへ適用するissueを立ててほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3754454233"
        summary: "Validatorが実体まで返すのは違和感があり、判定結果とエラーのみを返すべきという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3755263484"
        summary: "same_variantメソッドと判定ロジックをvalidatorとして外だししてほしいという指摘"

  - id: "insight-010"
    category: "design"
    severity: "WARNING"
    title: "複数の責務を持つdomain actionは責務ごとに分割し、他actionの責務と重複させない"
    guideline: |
      1つのdomain actionが複数の責務（例: 更新+パラメーター追加+パラメーター削除）を持つ場合は、
      責務ごとに別々のactionへ分割する（例: update_step, add_parameter, remove_parameter）。
      分割にあたっては、既に別のactionでカバーされている処理をスコープに含めず重複させない。
      domain actionを分割した場合はuse_case・presentation層も同様に分割する。
    anti_pattern: |
      1つのactionが更新・追加・削除など複数の責務を持ったまま実装される。
      add_step のスコープに、別途 add_parameter action が担うパラメーター設定処理まで含める。
    good_pattern: |
      update_step, add_parameter, remove_parameter のように責務ごとにactionを分割し、
      対応するuse_case・presentation層も同様に分割する。add_step のスコープはパラメーター
      未設定のstep追加までに限定する。
    scope:
      - "backend/src/domain/actions/**"
      - "backend/src/use_case/**"
      - "backend/src/presentation/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3730221471"
        summary: "actionが複雑になっているのでupdate_step, add_parameter, remove_parameterに分割してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3754418546"
        summary: "add_parameter actionが別に存在するのでadd_stepのスコープはパラメーター未設定のstep追加まででよいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791113202"
        summary: "use_caseもdomain actionに合わせてstep更新・parameter追加・parameter削除の3つに分割し、presentation層も同様にという指摘"

  - id: "insight-011"
    category: "design"
    severity: "INFO"
    title: "重複するルックアップ・検証ロジックはモデル・共通メソッドとして共通化する"
    guideline: |
      複数箇所で同じロジックが重複実装される場合は、共通のメソッドとして共通化する。
      例えば、Trialからidを指定してStepを取得する処理は `Trial::step(&self, id: &StepId) -> Option<&Step>`
      のようにモデルのメソッドとして実装し、Stepからparameterを取得する処理も同様にする。
      is_nan や範囲チェック（x <= 0.0 等）のような検証ロジックが複数箇所に重複する場合も
      共有メソッドとしてまとめる。
    anti_pattern: |
      idからのStep/Parameter取得処理や、is_nan・範囲チェックのような検証ロジックを
      複数のaction/validatorに個別に重複実装する。
    good_pattern: |
      Trial::step() / Step::parameter() のようなモデルのアクセサメソッド、あるいは
      共通の検証ヘルパーメソッドとして一箇所にまとめ、各actionはそれを呼び出す。
    scope:
      - "backend/src/domain/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3755172153"
        summary: "trialからidのstepを取得する処理をTrialモデルのメソッドとして共通化し、stepからparameterを取得する処理も同様にという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4038960465"
        summary: "is_nanとx<=0.0のチェックが複数箇所で重複しているのでメソッドとしてまとめてほしいという指摘"

  - id: "insight-012"
    category: "design"
    severity: "CRITICAL"
    title: "presentation層からdomain層への直接参照を行わない"
    guideline: |
      presentation層はdomain層を一切参照しない。use_caseの引数としてdomainのcommand struct
      を利用すると、それを構築するためにpresentation層がdomain層に依存してしまう原因になるため、
      domain action command の作成やそれに向けた値の加工はuse_case層が担当する。
      presentation層からuse_case層への値の受け渡しはフラットなインデックス引数で行う
      （配列やオブジェクト形式が前提のparameter等を無理にフラット化する必要はない）。
    anti_pattern: |
      presentation層のリゾルバーがdomain層のcommand structを直接importして構築し、
      use_caseにそのまま渡す。
    good_pattern: |
      presentation層はuse_caseにフラットな引数（あるいは自然にオブジェクトである入力はその形）を渡し、
      domainのcommand構築や値の加工はuse_case層の内部で行う。
    scope:
      - "backend/src/presentation/**"
      - "backend/src/use_case/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3776372572"
        summary: "presentationレイヤーからdomainレイヤーへの参照は一切行わず、use_caseの引数はフラットなインデックス引数で渡すべきという指摘"

  - id: "insight-013"
    category: "style"
    severity: "INFO"
    title: "エラー変換の実装ファイルはモデル（ドメイン）ごとに分割する"
    guideline: |
      presentation層のエラー変換など、1つのファイルに全モデルのエラーハンドリングを
      まとめて実装するとファイルが肥大化するため、モデルごとにファイルを分割する。
    anti_pattern: |
      `presentation/graphql/error.rs` のような1ファイルに全モデルのエラー変換ロジックを詰め込む。
    good_pattern: |
      backend/src/presentation/graphql/error/ 配下に common.rs, project.rs, trial.rs のように
      モデルごとにファイルを分割する。
    scope:
      - "backend/src/presentation/graphql/error/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3776453948"
        summary: "1つのファイルで全エラーを管理するのが辛くなってきているのでモデルごとに分割してほしいという指摘"

  - id: "insight-014"
    category: "design"
    severity: "INFO"
    title: "presentation層で重複する共通処理はcommon.rsに集約し、メッセージも統一する"
    guideline: |
      UUIDのパース処理のような、複数のpresentation層リゾルバー（trial query, project presentation等）
      で共通して必要になる処理は `presentation/common.rs` のような共通モジュールに実装し、
      重複実装を避ける。エラーメッセージも一律の文言に統一する（例: "Invalid UUID format"）。
    anti_pattern: |
      同じUUIDパース処理を各mutation/queryのリゾルバーに個別に実装し、エラーメッセージの
      文言も箇所ごとにばらつく。
    good_pattern: |
      `presentation/common.rs` に共通処理を実装し、全リゾルバーがそこを呼び出す。
      エラーメッセージは "Invalid UUID format" のように統一する。
    scope:
      - "backend/src/presentation/graphql/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791149039"
        summary: "trial queryやproject presentationでも共通している処理をpresentation/common.rsに切り出し、メッセージも統一してほしいという指摘"

  - id: "insight-015"
    category: "performance"
    severity: "WARNING"
    title: "書き込みを伴わない読み取りはトランザクション開始前に実行し保持時間を最小化する"
    guideline: |
      書き込みユースケースでは、トランザクションの保持時間を最小化するため、処理順序を
      「データ取得（書き込みを伴わない読み取り） → ドメインアクション実行 → トランザクション開始
      → save → コミット」に統一する。トランザクション開始 → データ取得 → アクション実行 → save
      → コミット、のように実際には書き込みを行わない取得までトランザクション内で行わない。
    anti_pattern: |
      書き込みを伴わないfind_by_idなどの取得処理をトランザクション開始後に実行し、
      不要にトランザクションを長く保持する。
    good_pattern: |
      データ取得 → ドメインアクション実行 → トランザクション開始 → save → コミット、
      の順で実装し、全ての書き込みユースケースでこの順序に統一する。
    scope:
      - "backend/src/use_case/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791102504"
        summary: "書き込みの発生しないtrialの取得はトランザクションオープン前に実行してほしいという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r3791339645"
        summary: "書き込みの発生しないtrialの取得はトランザクションのオープン前に実行し、すべてのユースケースで同様の対応をという指摘"
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4056949341"
        summary: "実際に書き込むのはsaveのみなのでトランザクションの処理順序をデータ取得→アクション実行→トランザクション開始→save→コミットに統一してほしいという指摘"

  - id: "insight-016"
    category: "design"
    severity: "INFO"
    title: "opaqueなJSONコンテンツを返すGraphQLオブジェクトには種別を示すフィールドも公開する"
    guideline: |
      GraphQLオブジェクトが `content` のようなJSONスカラーとして不透明な内容を返す場合、
      フロントエンドがそのオブジェクト形式から種別（parameter typeなど）を推測する負荷を避けるため、
      種別を示す明示的なフィールドもGraphQLオブジェクトのフィールドとして公開する。
    anti_pattern: |
      parameter typeをcontentのJSON形式からフロントエンドに推測させる。
    good_pattern: |
      content フィールドに加えて parameter type を独立したフィールドとしてGraphQLオブジェクトに公開する。
    scope:
      - "backend/src/presentation/graphql/types/**"
    status: active
    frequency: 1
    last_seen: "2026-09-21"
    added_from_pr: 42
    evidence:
      - pr: 42
        comment_url: "https://github.com/fucso/bake-loose/pull/42#discussion_r4039096364"
        summary: "contentのオブジェクト形式からparameter typeを特定するのは負荷が大きいのでフィールドとして返してほしいという指摘"

  - id: "insight-017"
    category: "style"
    severity: "INFO"
    title: "find_by_id後のエラーハンドリングの記載パターンをファイル間で統一する"
    guideline: |
      use_case内でリポジトリの find_by_id を呼んだ後、結果を変数にセットして後続処理を行う
      実装パターンは、プロジェクト内の他のuse_caseファイルと記載方法を統一する。
    anti_pattern: |
      find_by_id後のエラーハンドリング・結果の取り出し方がuse_caseファイルごとに異なる書き方になる。
    good_pattern: |
      既存の統一された実装パターンに合わせて find_by_id 後の処理を記述する。
    scope:
      - "backend/src/use_case/**"
